[project]
name = "vertex-research-assistant"
version = "1.1.0"
description = "Concurrent cited research around the AI Academy provider contract"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 110
include = ["researcher/**/*.py", "tests/test_se*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["researcher"]
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.coverage.run]
source = ["researcher"]
omit = ["researcher/__main__.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
